[general]
base_dir = "/opt/lampp/htdocs/webfiles/uploads"
title = "WebFilesDesk Explorer"
date_format = "d-m-Y H:i"
background  = ""
language = en

[options]
enable_search = true
enable_download = true
enable_upload = true
max_upload_size  = 100MB
enable_delete = true
debug = false

[exclude]
patterns = "*.exe, robots.txt, *.ini, *.log, *.sh, *.sql, *.env, *.bak, *.swp, *.orig"
