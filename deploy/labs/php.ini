; Lab PHP settings: close to XAMPP's defaults, because the labs are written for it
; (several rely on visible errors). The container is the security boundary.
expose_php = Off
display_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 20M
post_max_size = 25M

; "localhost" DB connections use the socket shared with labs-db.
pdo_mysql.default_socket = /run/mysqld/mysqld.sock
mysqli.default_socket = /run/mysqld/mysqld.sock
