# Gateway: splits traffic by Host header.
#   pwnedbox.site / www.pwnedbox.site -> platform
#   <anything>.pwnedbox.site          -> labs (Apache there picks the lab folder)
#
# Only the host nginx can reach this port (published on 127.0.0.1), and it puts
# the real visitor IP in X-KP-Client-IP. A custom header is used on purpose:
# labs that teach X-Forwarded-For / X-Real-IP spoofing must still receive
# whatever the student sends.

set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-KP-Client-IP;

map $request_method $kp_auth_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $kp_auth_key        zone=kp_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kp_labs:20m rate=100r/s;
limit_req_status 429;

map $http_x_forwarded_proto $kp_proto {
    default $http_x_forwarded_proto;
    ""      http;
}

server_tokens off;
client_max_body_size 25m;
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-KP-Client-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $kp_proto;
proxy_read_timeout 60s;

# ---- Main site: apex and www -------------------------------------------------
server {
    listen 8080;
    server_name ~^(?<kp_www>www\.)?(?<kp_apex>[^.]+\.[^.]+)$;

    if ($kp_www) {
        return 301 https://$kp_apex$request_uri;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Old links /subdomains/<lab>/... move to https://<lab>.<domain>/...
    # Underscores are not valid in hostnames: race_condition -> race-condition.
    location ~ ^/subdomains/[A-Za-z0-9-]*_ {
        rewrite ^/subdomains/([A-Za-z0-9-]*)_(.*)$ /subdomains/$1-$2 last;
    }
    location ~ ^/subdomains/(?<kp_lab>[A-Za-z0-9-]+)(?<kp_rest>/.*)?$ {
        return 301 https://$kp_lab.$kp_apex$kp_rest$is_args$args;
    }

    # Never served publicly.
    location ~* ^/(phpmyadmin|dashboard|xampp|webalizer|server-status|server-info|config|data|deploy|HackerOneReport)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
    location ~* \.(sql|md|sh|bak|log|ini|inc|env|lock)$ {
        return 404;
    }

    location = /api/auth_api.php {
        limit_req zone=kp_auth burst=20 nodelay;
        set $kp_up http://platform:8080;
        proxy_pass $kp_up;
    }

    location / {
        set $kp_up http://platform:8080;
        proxy_pass $kp_up;
    }
}

# ---- Labs: every other host --------------------------------------------------
server {
    listen 8080 default_server;
    server_name _;

    location / {
        limit_req zone=kp_labs burst=300 nodelay;
        set $kp_up http://labs:8080;
        proxy_pass $kp_up;
    }
}
