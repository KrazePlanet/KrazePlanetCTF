; Main site PHP settings (loaded after php.ini-production)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On

memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 8M
post_max_size = 10M

; __Host- cookies can only be set by pwnedbox.site itself over HTTPS, so a lab
; on a subdomain cannot plant or overwrite the main site's session cookie.
session.name = ${PHP_SESSION_NAME}
session.cookie_secure = ${PHP_COOKIE_SECURE}
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.save_path = /var/lib/php/sessions
session.gc_maxlifetime = 86400
session.gc_probability = 1
session.gc_divisor = 100

; The main site never needs to run programs.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
