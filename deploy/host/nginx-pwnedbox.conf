# Host nginx site for pwnedbox.site -> /etc/nginx/sites-available/pwnedbox.site
#
# Needs, in /etc/ssl/cloudflare/:
#   pwnedbox.site.pem / .key   Cloudflare Origin Certificate for
#                              "pwnedbox.site, *.pwnedbox.site"
#                              (SSL/TLS -> Origin Server -> Create Certificate)
#   origin-pull-ca.pem         Cloudflare's Authenticated Origin Pulls CA:
#     curl -o /etc/ssl/cloudflare/origin-pull-ca.pem \
#       https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# and in Cloudflare: SSL/TLS mode "Full (strict)" and
# SSL/TLS -> Origin Server -> Authenticated Origin Pulls = On.
#
# With origin pulls on, nginx rejects any TLS connection that does not come
# from Cloudflare, so nobody can skip Cloudflare by hitting 5.189.147.156 directly.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pwnedbox.site *.pwnedbox.site;

    ssl_certificate         /etc/ssl/cloudflare/pwnedbox.site.pem;
    ssl_certificate_key     /etc/ssl/cloudflare/pwnedbox.site.key;
    ssl_client_certificate  /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client       on;
    ssl_protocols           TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Only Cloudflare can connect (see above), so its header is trustworthy.
        proxy_set_header X-KP-Client-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pwnedbox.site *.pwnedbox.site;
    return 301 https://$host$request_uri;
}
