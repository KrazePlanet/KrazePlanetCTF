<VirtualHost *:80>
    ServerAlias *

    DocumentRoot /opt/lampp/htdocs

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/lampp/htdocs/instances>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyErrorOverride On
    ErrorDocument 502 /navbar/spawn_lab.php
    ErrorDocument 503 /navbar/spawn_lab.php

    RewriteEngine On

    # Exclude internal self-healing handlers from reverse proxy
    RewriteCond %{REQUEST_URI} ^/(navbar/spawn_lab\.php|navbar/spawn_mailpit\.php|navbar/open_mailbox\.php|spawn_lab\.php|spawn_mailpit\.php|open_mailbox\.php) [NC]
    RewriteRule ^ - [L]

    # 1. Real-Time Live Push WebSocket for Mailpit (/api/events)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\..+$ [NC]
    RewriteRule ^/(.*)$ ws://kp_%1_mailpit:8025/$1 [P,L]

    # 2. HTTP Web Interface for Mailpit
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_mailpit:8025/$1 [P,L]

    # Hyphenated Subdomain: {username}-{lab}.{domain}
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+)\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    # Nested Subdomain: {username}.{lab}.{domain}
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+)\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    ProxyPassReverse / http://kp_%1_%2:80/
</VirtualHost>

<VirtualHost *:443>
    ServerAlias *

    DocumentRoot /opt/lampp/htdocs

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/kzlabs-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/kzlabs-origin.key

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/lampp/htdocs/instances>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyErrorOverride On
    ErrorDocument 502 /navbar/spawn_lab.php
    ErrorDocument 503 /navbar/spawn_lab.php

    RewriteEngine On

    # Exclude internal self-healing handlers from reverse proxy
    RewriteCond %{REQUEST_URI} ^/(navbar/spawn_lab\.php|navbar/spawn_mailpit\.php|navbar/open_mailbox\.php|spawn_lab\.php|spawn_mailpit\.php|open_mailbox\.php) [NC]
    RewriteRule ^ - [L]

    # 1. Real-Time Live Push WebSocket for Mailpit (/api/events)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\..+$ [NC]
    RewriteRule ^/(.*)$ ws://kp_%1_mailpit:8025/$1 [P,L]

    # 2. HTTP Web Interface for Mailpit
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_mailpit:8025/$1 [P,L]

    # Hyphenated Subdomain: {username}-{lab}.{domain}
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+)\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    # Nested Subdomain: {username}.{lab}.{domain}
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+)\..+$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    ProxyPassReverse / http://kp_%1_%2:80/

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>