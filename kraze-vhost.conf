<VirtualHost *:80>
    ServerName kzlabs.in
    ServerAlias *.kzlabs.in *.localhost *.localtest.me *.nip.io *.127.0.0.1.nip.io localhost 127.0.0.1 157.230.58.200 178.128.144.87

    DocumentRoot /opt/lampp/htdocs

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/lampp/htdocs/instances>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyErrorOverride On
    ErrorDocument 502 /navbar/spawn_lab.php
    ErrorDocument 503 /navbar/spawn_lab.php

    RewriteEngine On

    # Exclude internal self-healing handlers from reverse proxy
    RewriteCond %{REQUEST_URI} ^/(navbar/spawn_lab\.php|navbar/spawn_mailpit\.php|navbar/open_mailbox\.php|spawn_lab\.php|spawn_mailpit\.php|open_mailbox\.php) [NC]
    RewriteRule ^ - [L]

    # 1. Real-Time Live Push WebSocket for Mailpit (/api/events)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ ws://kp_%1_mailpit:8025/$1 [P,L]

    # 2. HTTP Web Interface for Mailpit
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit\.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_mailpit:8025/$1 [P,L]

    # Exclude direct portal requests from reverse proxy
    RewriteCond %{HTTP_HOST} ^(www\.)?kzlabs\.in$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^localhost$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^localtest\.me$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^127\.0\.0\.1$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^157\.230\.58\.200$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^178\.128\.144\.87$ [NC]
    RewriteRule ^ - [L]

    # Hyphenated Subdomain: {username}-{lab}.(kzlabs.in|localhost|localtest.me)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+)\.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    # Nested Subdomain: {username}.{lab}.(kzlabs.in|localhost|localtest.me)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+)\.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    ProxyPassReverse / http://kp_%1_%2:80/
</VirtualHost>

