<VirtualHost *:80>
    ServerName kzlabs.in
    ServerAlias *.kzlabs.in *.localhost localhost 127.0.0.1 157.230.58.200

    DocumentRoot /opt/lampp/htdocs

    # Automatic 301 Permanent Redirect to HTTPS for kzlabs.in and all subdomains
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP_HOST} !^localhost$ [NC]
    RewriteCond %{HTTP_HOST} !^127\.0\.0\.1$ [NC]
    RewriteCond %{HTTP_HOST} !\.localhost$ [NC]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On

    # Mailpit Web Interface on mail.localhost or mailpit.localhost
    RewriteCond %{HTTP_HOST} ^(mail|mailpit)\.localhost$ [NC]
    RewriteRule ^/(.*)$ http://mailpit:8025/$1 [P,L]

    # Local development proxy fallbacks for .localhost
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+)\.localhost$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+)\.localhost$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName kzlabs.in
    ServerAlias *.kzlabs.in *.localhost localhost 127.0.0.1 157.230.58.200

    DocumentRoot /opt/lampp/htdocs

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/kzlabs-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/kzlabs-origin.key

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/lampp/htdocs/instances>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 60

    RewriteEngine On

    # 1. Mailpit WebSocket Support for Real-time Inbox Updates
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteCond %{HTTP_HOST} ^(mail|mailpit)\.(kzlabs\.in|localhost)$ [NC]
    RewriteRule ^/api/v1/ws$ ws://mailpit:8025/api/v1/ws [P,L]

    # 2. Mailpit Web Interface on mail.kzlabs.in and mailpit.kzlabs.in
    RewriteCond %{HTTP_HOST} ^(mail|mailpit)\.(kzlabs\.in|localhost)$ [NC]
    RewriteRule ^/(.*)$ http://mailpit:8025/$1 [P,L]

    # 3. Direct path fallback: https://kzlabs.in/mailpit/
    ProxyPass /mailpit/ http://mailpit:8025/
    ProxyPassReverse /mailpit/ http://mailpit:8025/

    # Exclude direct portal requests from reverse proxy
    RewriteCond %{HTTP_HOST} ^(www\.)?kzlabs\.in$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^localhost$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^127\.0\.0\.1$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^157\.230\.58\.200$ [NC]
    RewriteRule ^ - [L]

    # Hyphenated Subdomain: {username}-{lab}.(kzlabs.in|localhost)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+)\.(kzlabs\.in|localhost)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    # Nested Subdomain: {username}.{lab}.(kzlabs.in|localhost)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+)\.(kzlabs\.in|localhost)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    ProxyPassReverse / http://kp_%1_%2:80/

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
