<VirtualHost *:80>
    ServerName kzlabs.in
    ServerAlias *.kzlabs.in *.localhost *.localtest.me *.nip.io *.127.0.0.1.nip.io localhost 127.0.0.1 157.230.58.200

    DocumentRoot /opt/lampp/htdocs

    # Automatic 301 Permanent Redirect to HTTPS for kzlabs.in and all subdomains
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteCond %{HTTP_HOST} !^localhost$ [NC]
    RewriteCond %{HTTP_HOST} !^127\.0\.0\.1$ [NC]
    RewriteCond %{HTTP_HOST} !.(localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    # Exclude internal self-healing handlers from reverse proxy
    RewriteCond %{REQUEST_URI} ^/(navbar/spawn_mailpit\.php|navbar/open_mailbox\.php|spawn_mailpit\.php|open_mailbox\.php) [NC]
    RewriteRule ^ - [L]

    # 1. Real-Time Live Push WebSocket for Mailpit (/api/events)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit.(localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ ws://kp_%1_mailpit:8025/$1 [P,L]

    # 2. HTTP Web Interface for Mailpit
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit.(localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_mailpit:8025/$1 [P,L]

    # Local development proxy fallbacks for .localhost
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+).(localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+).(localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName kzlabs.in
    ServerAlias *.kzlabs.in *.localhost *.localtest.me *.nip.io *.127.0.0.1.nip.io localhost 127.0.0.1 157.230.58.200

    DocumentRoot /opt/lampp/htdocs

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/kzlabs-origin.crt
    SSLCertificateKeyFile /etc/ssl/private/kzlabs-origin.key

    <Directory /opt/lampp/htdocs>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /opt/lampp/htdocs/instances>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    RewriteEngine On

    # Exclude internal self-healing handlers from reverse proxy
    RewriteCond %{REQUEST_URI} ^/(navbar/spawn_mailpit\.php|navbar/open_mailbox\.php|spawn_mailpit\.php|open_mailbox\.php) [NC]
    RewriteRule ^ - [L]

    # 1. Real-Time Live Push WebSocket for Mailpit (/api/events)
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ ws://kp_%1_mailpit:8025/$1 [P,L]

    # 2. HTTP Web Interface for Mailpit
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-mailpit.(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_mailpit:8025/$1 [P,L]

    # Exclude direct portal requests from reverse proxy
    RewriteCond %{HTTP_HOST} ^(www\.)?kzlabs\.in$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^localhost$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^127\.0\.0\.1$ [NC,OR]
    RewriteCond %{HTTP_HOST} ^157\.230\.58\.200$ [NC]
    RewriteRule ^ - [L]

    # Hyphenated Subdomain: {username}-{lab}.(kzlabs.in|localhost)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)-([a-zA-Z0-9_\-]+).(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    # Nested Subdomain: {username}.{lab}.(kzlabs.in|localhost)
    RewriteCond %{HTTP_HOST} ^([a-zA-Z0-9_]+)\.([a-zA-Z0-9_\-]+).(kzlabs\.in|localhost|localtest\.me|127\.0\.0\.1\.nip\.io|nip\.io)$ [NC]
    RewriteRule ^/(.*)$ http://kp_%1_%2:80/$1 [P,L]

    ProxyPassReverse / http://kp_%1_%2:80/

    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
</VirtualHost>
